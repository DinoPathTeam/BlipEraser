name: strix
# Solo ejecución manual (Actions → strix → Run workflow): cada corrida gasta
# crédito de la API (hasta --max-budget USD), así que no se lanza en cada PR.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pentest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pineado
        with:
          fetch-depth: 0

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      # Escaneo de apoyo, no una puerta de calidad: depende de un servicio de
      # pago externo (crédito de la API). Si falla por facturación o red, el
      # PR no debe quedar bloqueado; el informe se sube igualmente. La puerta
      # real es el job `ci` (pytest + compileall).
      - name: Run Strix
        continue-on-error: true
        env:
          # El secreto del repo se llama ANTHROPIC_API_KEY; Strix espera LLM_API_KEY.
          LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIX_LLM: ${{ secrets.STRIX_LLM || 'anthropic/claude-sonnet-4-6' }}
        run: strix -n -t ./ --scan-mode quick --max-budget 5

      - name: Upload Strix report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v4 pineado
        with:
          name: strix-report
          path: strix_runs/
          retention-days: 14

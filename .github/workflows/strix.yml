name: strix
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pentest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6 pineado
        with:
          fetch-depth: 0

      - name: Install Strix
        run: curl -sSL https://strix.ai/install | bash

      - name: Run Strix
        env:
          # El secreto del repo se llama ANTHROPIC_API_KEY; Strix espera LLM_API_KEY.
          LLM_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          STRIX_LLM: ${{ secrets.STRIX_LLM || 'anthropic/claude-sonnet-4-6' }}
        run: strix -n -t ./ --scan-mode quick --max-budget 5

      - name: Upload Strix report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 pineado
        with:
          name: strix-report
          path: strix_runs/
          retention-days: 14

name: ci
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 pineado
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5 pineado
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.9 shellcheck-py==0.11.0.1
      - run: python -m compileall -q src
      - run: ruff check src tests
      - run: shellcheck -S warning scripts/*.sh
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.14"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4 pineado
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v5 pineado
        with:
          python-version: ${{ matrix.python-version }}
      # Librerías que Qt necesita para arrancar sin pantalla (tests de GUI).
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 \
            libglib2.0-0 libpulse0
      - run: pip install "pytest>=7.0" "PyQt6>=6.4"
      - run: python -m pytest tests/ -q

<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- Policy for the privileged daemon (root) -->
  <policy user="root">
    <allow own="com.dinopath.BlipEraser.Privileged"/>
    <allow send_destination="com.dinopath.BlipEraser.Privileged"/>
  </policy>

  <!-- Policy for users in 'wheel' group (admin users on Arch) -->
  <policy group="wheel">
    <allow send_destination="com.dinopath.BlipEraser.Privileged"/>
    <allow receive_sender="com.dinopath.BlipEraser.Privileged"/>
  </policy>

  <!-- Deny by default for all other users -->
  <policy context="default">
    <deny send_destination="com.dinopath.BlipEraser.Privileged"/>
    <deny receive_sender="com.dinopath.BlipEraser.Privileged"/>
  </policy>
</busconfig>
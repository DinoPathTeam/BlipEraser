[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blip-eraser"
version = "0.1.0"
description = "Desinstalador de aplicaciones para Arch Linux"
readme = "README.es.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BlipEraser contributors" }]
keywords = ["arch", "uninstaller", "pyqt6", "pacman"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

# PyQt6 y PyGObject se instalan deliberadamente fuera de pip: en Arch Linux con
# `sudo pacman -S python-pyqt6 python-gobject` para evitar conflictos con el runtime.
# python-gobject provee gi.repository.Gio/GLib para D-Bus daemon y cliente (Fase 2).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
blip-eraser = "blip_eraser.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = [
    "packaging/polkit/*.policy",
    "packaging/dbus/*.xml",
    "packaging/dbus/*.conf",
    "packaging/systemd/*.service",
]

# Instalar archivos de sistema en las ubicaciones correctas
[tool.setuptools.data-files]
"/usr/share/polkit-1/actions" = ["packaging/polkit/com.dinopath.blip-eraser.policy"]
"/usr/share/dbus-1/system.d" = ["packaging/dbus/blip-eraser-privileged.conf"]
"/usr/share/dbus-1/interfaces" = ["packaging/dbus/com.dinopath.BlipEraser.Privileged.xml"]
"/usr/lib/systemd/system" = ["packaging/systemd/blip-eraser-privileged.service"]
"/usr/lib/blip-eraser" = ["packaging/scripts/blip-eraser-privileged"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blip-eraser"
version = "0.1.0"
description = "Desinstalador de aplicaciones para CachyOS / Arch Linux"
readme = "README.es.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BlipEraser contributors" }]
keywords = ["cachyos", "arch", "uninstaller", "pyqt6", "pacman"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

# PyQt6 se instala deliberadamente fuera de pip: en Arch/CachyOS con
# `sudo pacman -S python-pyqt6` para evitar conflictos con el runtime.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
blip-eraser = "blip_eraser.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blip-eraser"
version = "1.0.5"
description = "Desinstalador de aplicaciones para Arch Linux"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "BlipEraser contributors" }]
keywords = ["arch", "uninstaller", "pyqt6", "pacman"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
]

# PyQt6 y PyGObject se instalan deliberadamente fuera de pip: en Arch Linux con
# `sudo pacman -S python-pyqt6 python-gobject` para evitar conflictos con el runtime.
# python-gobject provee gi.repository.Gio/GLib para D-Bus daemon y cliente (Fase 2).
#
# Opcional: QtMultimedia (video de intro en splash screen)
# En Arch: `sudo pacman -S qt6-multimedia gstreamer gst-plugins-base gst-plugins-good gst-libav`
# gst-libav ES REQUERIDO para decodificar H.264/H.265/AAC (licencias: gst-plugins-good no lo incluye).
# Sin gst-libav, el video no se decodifica, salta error y cae a fallback de logo.
# Requiere backend multimedia (gstreamer + plugins). Si no está disponible,
# la app usa fallback silencioso a animación de logo (sin romper el arranque).
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
blip-eraser = "blip_eraser.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = [
    "packaging/polkit/*.policy",
    "packaging/dbus/*.xml",
    "packaging/dbus/*.conf",
    "packaging/systemd/*.service",
]

# NOTA: sin [tool.setuptools.data-files]. Los data-files absolutos se
# instalan MAL desde wheels (quedan anidados bajo site-packages en vez
# de /usr, /etc). Cada vía de entrega instala los archivos de sistema
# explícitamente: scripts/install-daemon.sh (nativo), PKGBUILD (AUR).
# (El flatpak los excluye por diseño: el daemon vive en el host.)

[tool.pytest.ini_options]
testpaths = ["tests"]